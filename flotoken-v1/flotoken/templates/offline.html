<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C2410C"><title>Offline</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F3F5F2;color:#15221C;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px}
  main{max-width:340px;text-align:center}
  .coin{width:72px;height:72px;margin:0 auto 18px;border-radius:50%;background:#C2410C;color:#fff;display:grid;place-items:center;font:800 34px/1 system-ui,sans-serif}
  h1{font-size:22px;margin:0 0 8px} p{margin:0 0 20px;color:#5B6A62}
  button{min-height:48px;padding:0 24px;border-radius:12px;border:0;background:#C2410C;color:#fff;font:700 16px system-ui,sans-serif;cursor:pointer}
  @media(prefers-color-scheme:dark){body{background:#0B130E;color:#E9F2EC}p{color:#8FA597}}
</style></head>
<body><main><div class="coin">F</div><h1>You are offline</h1><p>Check your Wi-Fi or mobile data. This page reconnects by itself as soon as the internet is back.</p>
<button onclick="location.reload()">Try again</button></main>
<script>addEventListener('online', () => location.reload());</script></body></html>
