{% extends "base.html" %}
{% block title %}Order history{% endblock %}
{% block content %}
<div class="page-h">
  <div><h1>Order history</h1><p>Find any order by token, phone or name. Every payment and change is recorded here.</p></div>
</div>
<div class="card flat mb">
  <div class="form-grid two" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
    <label class="field">Date<input type="date" id="date"></label>
    <label class="field">Search<input type="search" id="q" placeholder="Token, phone or name" autocomplete="off"></label>
    <label class="field">Status<select id="status"><option value="">All</option><option value="placed">Waiting</option><option value="preparing">Cooking</option><option value="ready">Ready</option><option value="collected">Collected</option><option value="cancelled">Cancelled</option></select></label>
  </div>
  <p class="muted small num" id="summary" style="margin-top:10px"></p>
</div>
<div class="table-wrap"><table>
  <thead><tr><th>Token</th><th>Time</th><th>Source</th><th>Customer</th><th>Items</th><th class="num">Total</th><th>Payment</th><th>Status</th><th></th></tr></thead>
  <tbody id="rows"></tbody>
</table></div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/history.js') }}?v={{ ASSET_V }}"></script>
{% endblock %}
