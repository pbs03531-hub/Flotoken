# Render Blueprint for Flotoken.
#
# This file starts a FREE demo service. Free services go to sleep after 15 minutes without visitors and
# lose every file on restart, so orders and menu edits are NOT kept. Use it to show the app, not to run a
# restaurant. The owner account and sample menu are recreated from the settings below each time.
#
# FOR A REAL RESTAURANT (data is kept):
#   1. Change   plan: free   to a paid plan (see render.com/pricing).
#   2. Remove the "#" in front of the disk block and the DB_FILE variable below.
services:
  - type: web
    name: flotoken
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 60 --access-logfile -
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: OWNER_USERNAME
        sync: false            # Render asks you for this when you create the service
      - key: OWNER_PASSWORD
        sync: false            # ...and this (at least 6 characters)
      - key: RESTAURANT_NAME
        value: My Restaurant
      - key: SAMPLE_MENU
        value: "1"
      # - key: DB_FILE
      #   value: /var/data/flotoken.db
    # disk:
    #   name: flotoken-data
    #   mountPath: /var/data
    #   sizeGB: 1
